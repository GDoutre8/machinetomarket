      conversion_value: 4
      resale_relevance: 5
      lead_eligible: true
      capability_slot: true
      features_block: true
      proof_required: "roc_lb or rated_operating_capacity_lbs"
      buyer_reason: "Signals loader class and material-handling headroom."
    - rank: 4
