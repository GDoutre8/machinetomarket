      conversion_value: 5
      resale_relevance: 5
      lead_eligible: true
      capability_slot: false
      features_block: true
      proof_required: "track_percent_remaining or track_condition plus source/photos"
      buyer_reason: "Tracks are a major near-term ownership cost."
    - rank: 3
      feature: rated_operating_capacity
