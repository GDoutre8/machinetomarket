# MTM Feature Priority Maps v1
#
# Purpose:
#   Rank buyer-priority features by equipment type so MTM can control what
#   enters the lead, capability slot, and feature block.
#
# Ranking basis:
#   1. buyer_attention: how quickly buyers notice/filter by it
#   2. conversion_value: how strongly it can motivate inquiry
#   3. resale_relevance: how much it affects retained value or buyer risk
#
# Scores:
#   5 = very high, 1 = low
#
# Slot rules:
#   lead_eligible: suitable for the opening hook if confirmed and not crowded
#   capability_slot: should be translated into buyer outcome language
#   features_block: safe as a factual feature list item

compact_track_loader:
  ranked_features:
    - rank: 1
      feature: high_flow_hydraulics_with_gpm
      buyer_attention: 5
      conversion_value: 5
      resale_relevance: 5
      lead_eligible: true
      capability_slot: true
      features_block: true
      proof_required: "high_flow == yes and hi_flow_gpm or aux_flow_high_gpm present"
      buyer_reason: "Unlocks higher-demand attachments such as mulchers, trenchers, planers, and brush cutters."
    - rank: 2
      feature: track_condition_percent
