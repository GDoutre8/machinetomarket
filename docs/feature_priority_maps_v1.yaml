      buyer_attention: 5
      conversion_value: 4
      resale_relevance: 4
      lead_eligible: true
      capability_slot: false
      features_block: true
      proof_required: "cab_type enclosed plus heater/ac fields if stated"
      buyer_reason: "Improves operator comfort, weather protection, and resale appeal."
