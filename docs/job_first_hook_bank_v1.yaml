    note: "Each hook references a use case label that aligns with mtm_*_use_case_scorer.py outputs."
    description: "The copy engine uses the scorer's top use case label to filter qualifying hooks to the most relevant subset before applying the confidence + specificity tie-breaker. Hook job_type values map directly to scorer use case keys."

