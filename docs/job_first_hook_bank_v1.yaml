      medium_pool: [truck_loading_quarry, lumber_yard_loader, asphalt_plant, agricultural_silage]
      narrow_pool: [recycling_center, glass_lighter_material]
    dozer:
      large_pool: [land_clearing_dozer, mass_grading, pad_prep_commercial_dozer, finish_grading, midsize_versatile_dozer]
