# =============================================================================
# RESEARCH SUMMARY
# =============================================================================
research_summary:

  hook_design_principles:
    - "Lead with the buyer's job, not the spec. The spec earns trust on the second sentence."
    - "Name the trade or the work, not the machine class. 'Forestry mulching' lands harder than '90 HP CTL.'"
    - "Numbers in the first sentence must mean something operationally — gallons per minute the attachment can use, pounds the machine can lift to a deck height, hours the undercarriage has left."
    - "Avoid generic listing language entirely in opening lines. 'Runs great,' 'must see,' 'low hours,' and 'versatile' are flagged anti-patterns."
    - "Configuration trumps generic spec. A high-flow CTL with two-speed and AC opens differently than the same horsepower in a base-trim machine."
    - "If the registry data is null, the hook does not fire. Hooks gate on required_fields presence, not just match score."
    - "Strongest-follow-up-spec is selected to reinforce the hook's promise — pair a 'production class' opener with horsepower or operating weight, pair a 'finish work' opener with grade control or PAT blade, pair a 'tight access' opener with width or tail swing."
    - "Each hook's job_type aligns with use-case scorer output keys so wiring from scorer rank → hook selection is one-step lookup, not fuzzy match."

  hook_pattern_archetypes:
    trade_named:
      description: "Opens by naming the buyer's trade or industry — 'masonry contractor,' 'land clearing crew,' 'forestry mulching outfit.'"
      strength: "Highest — buyer recognizes themselves immediately."
      use_when: "Job is dominated by one identifiable trade and config matches."
      example: "Built for forestry mulching crews. {aux_flow_high_gpm} gpm of high-flow drives the heaviest mulchers in the class."

    job_named:
      description: "Opens by naming the work — 'pad prep,' 'truck loading,' 'fence post install.'"
      strength: "High — works when the trade is fragmented but the work is unambiguous."
      use_when: "Multiple trades buy the same machine for the same job."
      example: "Set up for pad-prep work. PAT blade and grade-control-ready mounts dial in spec subgrade in one machine."

    configuration_first:
      description: "Opens by naming the machine's standout configuration — 'high-flow,' 'two-speed,' 'PAT blade,' 'zero tail swing.'"
      strength: "High — surfaces what the buyer would search for."
      use_when: "Configuration is the differentiator between this machine and the price-comparable alternatives."
      example: "Two-speed-equipped CTL. {travel_speed_high_mph} mph top speed makes long site moves and yard cycles run real time."

    site_type_first:
      description: "Opens by naming the worksite environment — 'tight residential lots,' 'soft ground,' 'cold storage.'"
      strength: "Medium-high — pairs well when machine sizing is the story."
      use_when: "Buyer's pain point is access, weight, or environment, not capacity."
      example: "Sized for tight residential lots. {width_in}-inch frame fits gates and fence lines other CTLs can't approach."

    buyer_persona_first:
      description: "Opens by naming the operator profile — 'owner-operator,' 'fleet adder,' 'rental house,' 'small contractor.'"
      strength: "Medium — useful when the buyer-pool sorting matters more than the work."
      use_when: "Same machine reaches multiple buyer pools and one is the dominant fit."
      example: "Owner-operator workhorse. Trailerable, multi-purpose, and sized for residential work without a CDL."

    history_first:
      description: "Opens by naming the machine's service history or condition — 'one-owner,' 'dealer-maintained,' 'fresh undercarriage.'"
      strength: "Medium — works when condition is the differentiator, but risks 'low hours' anti-pattern."
      use_when: "Provenance is unusually strong AND ties to a job-fit story."
      example: "Single-owner finish-work CTL. Dealer-maintained from new — every grading job documented."

    class_positioning:
      description: "Opens by positioning the machine within its class — 'top of the X class,' 'large-frame,' 'production-class.'"
      strength: "Medium-high — buyer immediately knows where this fits in the lineup."
      use_when: "Spec lands at a class boundary or above — 'biggest CTL Bobcat builds,' 'large-frame mini ex.'"
      example: "Top of the {make} CTL class. {horsepower_hp} HP and {rated_operating_capacity_lbs} lbs ROC are the production end of the lineup."

  strongest_dealer_language_patterns:
    setup_phrases:
      - "Set up for {job}."
      - "Built for {job}."
      - "Dialed in for {job}."
      - "Configured for {job}."
      - "Spec'd for {job}."
    positioning_phrases:
      - "Top of the {make} {class} class."
      - "Production end of the lineup."
      - "Buy-and-work ready."
      - "Turn-key for {trade}."
    capability_phrases:
      - "Runs the {attachment} other machines stall on."
      - "Moves dirt by the day, not by the load."
      - "Pace of a {tier-up class}, footprint of a {tier-down class}."
    rationale: |
      These phrases are observed in working-dealer listing copy, equipment-trader sample sets, and
      OEM-published demonstration scripts. They share three properties: (1) they imply the seller knows
      the trade, (2) they commit to a use case rather than hedging across all possible buyers,
      (3) they don't apologize for the machine's limits. Anti-patterns ("versatile," "fits any job,"
      "low hours") signal the seller hasn't talked to a contractor recently.

  weak_phrases_to_avoid_in_hooks:
    flagged_in_first_sentence:
      - "for sale"
      - "must see"
      - "won't last"
      - "runs great"
      - "low hours"
      - "well maintained"
      - "versatile"
      - "fits any job"
      - "perfect for"
      - "great deal"
      - "great little machine"
      - "ready to work"
      - "turn-key"  # used positively in supporting copy but generic on its own as opener
    rationale: |
      Each of these tells the buyer the seller could not name a specific use case. The buyer's mental model
      for a strong listing is: the seller saw their work in this machine before they took the photos.

  hook_to_use_case_alignment:
    description: |
      Every job_type field in this bank is designed to align with a key in the corresponding
      mtm_*_use_case_scorer.py output. Selection precedence is: (1) match the scorer's top
      use case; (2) within ties, prefer higher confidence; (3) within ties, prefer hooks
      requiring more registry fields (more specific over more generic).
    integration_pseudocode: |
      top_use_case = scorer.run(machine).top_use_case
      candidates = hook_bank[category].filter(job_type == top_use_case)
      candidates = candidates.filter(all required_fields present in resolved)
      candidates = candidates.filter(eval(trigger_conditions, resolved) == True)
      ranked = sorted(candidates, key=(confidence, len(required_fields)), reverse=True)
      selected = ranked[0]

  category_buyer_pool_distribution:
    compact_track_loader:
      primary_pools: ["small-to-mid contractors", "owner-operators", "specialty trade (forestry, snow, ag)", "rental fleets"]
      hook_density_by_pool: "Specialty-trade hooks dominate (forestry, snow, ag, demo) because configuration drives buyer fit."
    skid_steer_loader:
      primary_pools: ["paving and concrete contractors", "agricultural", "yard operations", "municipal/DOT"]
      hook_density_by_pool: "Yard, paving, and ag hooks dominate; tight-access residential is CTL territory more often than SSL."
    mini_excavator:
      primary_pools: ["residential plumbers/electricians/landscapers", "septic and well drillers", "owner-operators"]
      hook_density_by_pool: "Residential excavation, utility trenching, and tight-access work dominate. Tail swing and width spec the buyer pool more than horsepower."
    telehandler:
      primary_pools: ["residential framers", "commercial framers and masons", "agricultural (bales/feed)", "rental fleets"]
      hook_density_by_pool: "Reach-class buyer pools split sharply at ~12,000 lb capacity / 55 ft reach — residential below, commercial above."
    excavator:
      primary_pools: ["site contractors", "utility contractors", "demolition", "specialty (forestry, scrap, quarry)"]
      hook_density_by_pool: "Class size sorts buyer pool more than configuration — 14-ton residential utility class vs. 30-ton+ production class are different markets."
    wheel_loader:
      primary_pools: ["aggregate yards", "agriculture", "snow/municipal", "construction", "industrial (recycling, ports, plants)"]
      hook_density_by_pool: "Yard-and-stockpile work dominates. Bucket capacity, dump clearance, and coupler readiness are the spec axes that sort buyer pools."
    dozer:
      primary_pools: ["site contractors", "land clearing", "agriculture/ranch", "specialty (landfill, mining, forestry)"]
      hook_density_by_pool: "Frame size and blade type sort buyer pools — residential PAT-blade work vs. mid-frame production vs. heavy mining/landfill are largely non-overlapping markets."

  copy_engine_integration_notes:
    selection_step:
      input: "resolved_specs (registry record), top_use_case (from scorer), category"
      output: "selected_hook (single hook entry from this bank)"
      logic: "Filter hooks by category and job_type alignment with top_use_case; filter to those with all required_fields present; eval trigger_conditions; rank by confidence + specificity; return top."
    rendering_step:
      input: "selected_hook, resolved_specs"
      output: "rendered_opening_line (string)"
      logic: "Random-pick or first-pick from selected_hook.opening_patterns; substitute {field} placeholders from resolved_specs; pass downstream to second-sentence builder which uses strongest_follow_up_spec."
    fallback_step:
      condition: "No hook matches OR required_fields not present"
      action: "Fall back to category-default generic opener (defined in op_value_maps_v1.yaml or copy engine defaults). DO NOT default to weak phrases."
    cross_reference: "All {field} placeholders in opening_patterns map to canonical resolver field names verified in op_value_maps_v1.yaml."

  v2_roadmap:
    expansion_targets:
      - "Per-make sub-hooks where OEM marketing language differs (Bobcat 'M-Series', CAT 'D-series', Kubota 'SVL Series')."
      - "Used-context modifier hooks: hours-band aware ('first owner under 1000 hrs'), age-band aware ('current emissions tier')."
      - "Attachment-bundle hooks where the listing includes attachments (bucket + forks + grapple = 'attachment-fleet workhorse' override)."
      - "Geographic modifier hooks (snow buyers in southern markets sort differently from northern)."
      - "Dual-job hooks for buyer pools that genuinely buy across two use cases (CTL ag-and-snow combo, telehandler ag-and-construction combo)."
    measurement_targets:
      - "Click-through differential vs. category-default opener (target: +35% on hook-matched listings)."
      - "Time-on-listing differential (target: +20%)."
      - "Inquiry rate differential (target: +25%)."
    open_questions:
      - "Should hook selection be deterministic (top-rank wins) or stochastic (top-3 weighted random) to avoid inventory-wide opener repetition?"
      - "How aggressively should low-confidence hooks be gated — currently they fire if all required_fields present, but a confidence floor of 'medium' may improve hit rate."
      - "Whether to surface multiple candidate openings to the dealer for manual selection in the listing UI, or commit to one and let dealer override."
# =============================================================================
# RESEARCH SUMMARY
