    - "Excellent condition"
    - "Runs great"
    - "Wont last"
    - "Priced to move"
    - "Must see"
    - "Many options"
    - "Lots of features"
    - "All you need"
    - "Versatile machine"
    - "A great machine"
    - "Years of life left"
    - "Like new"
    - "Low hours"

