# =============================================================================
# MTM Listing Copy Engine v3 — Job-First Hook Bank
# File: docs/job_first_hook_bank_v1.yaml
# Purpose: Generate the FIRST sentence of a listing as a buyer-job hook,
#          not a spec recitation. Contractors search for work, not torque.
#
# Lookup contract:
#   buyer's job -> required field set + trigger condition -> opening sentence patterns
#
# How the engine uses this:
#   1. For a given listing, evaluate each hook's required_fields and
#      trigger_conditions against the resolved spec set.
#   2. Score qualifying hooks against the use case scorer's top label.
#   3. Pick the highest-confidence qualifying hook whose use case matches.
#   4. Pull one of opening_patterns, populate templated fields from the
#      resolver, lead the listing with it.
#   5. Lead the body with strongest_follow_up_spec.
#
# Field references must match op_value_maps_v1.yaml exactly. Hook fires only
# if every required_field is non-null and not in requires_confirm.
#
# Confidence:
#   high   = strong dealer-language match, large buyer pool, low risk.
#   medium = valid but narrower buyer pool or seasonal dependency.
# =============================================================================

meta:
  version: "v1.0"
  schema_version: 1
  generated_for: "MTM Listing Copy Engine v3"
  cross_reference: "docs/op_value_maps_v1.yaml"
  hook_count_per_category: 25
  total_hook_count: 175
  policy_notes:
    - "Hook fires only when every required_field is non-null AND not in requires_confirm."
    - "Templated values (e.g. {hydraulic_flow_gpm}) are substituted from resolved_specs."
    - "trigger_conditions use Python boolean syntax — evaluable against resolved_specs dict."
    - "Hook selection precedence: scorer top use case match > confidence > required_field count (most specific wins)."
    - "If no hook qualifies, the engine falls back to a generic make+model+class opening."

