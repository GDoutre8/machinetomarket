  copy_engine_integration_notes:
    selection_algorithm: "1. For the listing, evaluate every hook in the matching equipment_type category. 2. A hook is qualifying if EVERY required_field is non-null AND not in requires_confirm, AND its trigger_conditions evaluate to true (or trigger_conditions is null). 3. From the qualifying set, find the subset whose job_type matches the scorer's top use case label. 4. Within that subset, pick the hook with highest confidence; on a tie, pick the one with the most required_fields (most specific match wins). 5. From opening_patterns, pick one (random with seed for repeatability, or A/B test). 6. Substitute templated values from resolved_specs. 7. The strongest_follow_up_spec is the field the body should lead with after the hook."
    fallback: "If no hook qualifies, fall back to a generic open: '{year} {make} {model} {class label}.' Never fabricate a hook. Never use a hook whose required fields arent present."

