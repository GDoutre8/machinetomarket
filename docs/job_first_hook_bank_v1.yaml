research_summary:

  hook_design_principles:
    - "Buyer first, machine second. Open with what the contractor is being hired to do."
    - "Name the trade by name. 'Masonry crew' beats 'pallet handling.' 'Pipeline crew' beats 'utility work.'"
    - "Lead with one differentiating spec, not three. The hook is the bait — the spec sheet is the meal."
    - "Use dealer language, not OEM language. 'Set up for...' / 'Built for...' / 'Dialed in for...' / 'Configured for...'"
    - "Do not open with year/make/model. That goes in the title bar; the hook is the value pitch."
    - "Avoid superlatives the listing cant support ('best', 'most powerful'). Use class-positioning instead ('top of the SSL class')."
    - "Hook fires only when its required fields are non-null AND not in requires_confirm — never bluff."

  hook_pattern_archetypes:
    - id: "trade_named"
      template: "[Trade] [machine class] — [one differentiating spec or feature]."
      example: "Masonry-crew telehandler — 8,000 lb capacity and 44-ft reach put block where the wall goes."
      best_for: "Trades with strong identity (masonry, framing, pipeline, paving, utility)."
    - id: "job_named"
      template: "[Job artifact] [machine class] — [the configuration for that job]."
      example: "Pad-prep dozer — six-way blade for precision residential pad work."
      best_for: "Specific job artifacts buyers search for (pad prep, trenching, footings)."
    - id: "configuration_first"
      template: "[Key feature] [machine class] — [what the feature unlocks]."
      example: "High-flow CTL built for forestry mulching, right-of-way clearing, and heavy attachment work."
      best_for: "Listings whose differentiating feature is hydraulic or cab package."
    - id: "site_type_first"
      template: "[Site type] [machine class] — [why this fits]."
      example: "Backyard-access CTL — fits standard 6-ft gates, gets the work done where bigger machines cant reach."
      best_for: "Width / access / clearance differentiators."
    - id: "buyer_persona_first"
      template: "[Persona] [machine class] — [the value pitch]."
      example: "Owner-operator CTL — enclosed cab, real attachment-running flow, dialed in for the contractor who runs one machine."
      best_for: "Persona-driven buyers (owner-operator, fleet contractor, first-machine buyer)."
    - id: "history_first"
      template: "One-owner [machine class] — [the trust pitch]."
      example: "One-owner skid — single maintenance trail, no surprises, ready to work."
      best_for: "Clean-history machines where provenance is the selling point."
    - id: "class_positioning"
      template: "[Class label] — [what the class means for the buyer]."
      example: "Production-class skid — top of the SSL class for HP and ROC, built to keep up with bigger crews."
      best_for: "Tier separators (compact vs midsize vs production)."

