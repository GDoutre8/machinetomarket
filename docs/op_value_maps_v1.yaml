    confidence: high

  heat_ac:
    operational_meaning: "HVAC system in the cab."
    buyer_value: "Operators stay sharp through summer heat and winter cold; longer productive shifts."
    ideal_for: [snow_removal, summer_grading, year_round_use]
    avoid_generic_phrase: ["climate controlled"]
    stronger_phrase:
      - "Heat and A/C — long days in the cab without operator fatigue dragging cycle times."
