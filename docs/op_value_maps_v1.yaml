  hydraulic_flow_gpm:
    operational_meaning: "Auxiliary circuit flow rate at standard pressure."
    buyer_value: "Defines what attachments will run at full speed without starving."
    ideal_for: [grapple_work, planer_use, augers, snow_blowers]
    avoid_generic_phrase: ["good hydraulic flow", "high flow capable"]
    stronger_phrase:
