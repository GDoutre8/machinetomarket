# =============================================================================
# RESEARCH SUMMARY
# =============================================================================
research_summary:

  # 1. Highest-value spec translations by category
  highest_value_translations:
    compact_track_loader:
      - field: "high_flow"
        why: "Direct buyer pain → attachment-driven workflows are the entire premium-CTL purchase rationale."
      - field: "rated_operating_capacity_lbs"
        why: "Pallet-class match is the single highest-buyer-decision spec."
      - field: "lift_path"
        why: "Vertical vs radial = direct fit for forklift/pallet vs grading/dirt work."
      - field: "track_percent_remaining"
        why: "Track replacement is $2k–4k+. Single biggest near-term cost exposure."
    skid_steer_loader:
      - field: "high_flow"
        why: "Same logic as CTL — attachment-driven work pays."
      - field: "rated_operating_capacity_lbs"
        why: "Pallet/yard class."
      - field: "two_speed"
        why: "Cycle-time multiplier on snow and yard work."
    mini_excavator:
      - field: "dig_depth_ft"
        why: "Direct trench/footing match — yes/no purchase driver."
      - field: "zero_tail_swing"
        why: "Defines what residential/urban work is even possible."
      - field: "hydraulic_thumb"
        why: "Doubles machine utility — pickup work in addition to digging."
    telehandler:
      - field: "max_lift_height_ft"
        why: "Defines what story-height the machine reaches."
      - field: "max_forward_reach_ft"
        why: "Over-foundation placement — different machine without it."
      - field: "stabilizers"
        why: "Unlocks the full chart at extension."
    excavator:
      - field: "bucket_breakout_force"
        why: "Tough-digging tier separator. Underpowered breakout = stalled cycles."
      - field: "auxiliary_flow"
        why: "Defines what hammers, shears, and processors will run."
      - field: "thumb"
        why: "Demolition and clearing utility."
    wheel_loader:
      - field: "bucket_capacity"
        why: "Direct production multiplier (yd³ × cycles/hr = output)."
      - field: "hinge_pin_height"
        why: "Yes/no for tractor-trailer dumping."
      - field: "breakout_force"
        why: "Frozen/compacted pile capability."
    dozer:
      - field: "PAT_blade"
        why: "Finish-grade vs rough-cut distinction."
      - field: "undercarriage_percent"
        why: "Largest near-term cost. Single biggest used-dozer concern."
      - field: "ripper"
        why: "Ground prep capability extension."

  # 2. Strongest buyer-outcome phrase patterns
  strongest_buyer_outcome_phrase_patterns:
    - pattern: "Runs {attachments} at full rated speed."
      rationale: "Concrete, falsifiable, attachment-named. Top dealer language."
    - pattern: "Handles standard {pallet/material} without compromise."
      rationale: "Names the actual job artifact."
    - pattern: "Clears most {gate/access type} on tight {site type}."
      rationale: "Direct site-fit answer."
    - pattern: "Buy-and-work — UC/tracks at {pct}% before any major spend."
      rationale: "Used-buyer financial framing — appeals to contractor cost discipline."
    - pattern: "Saves you {time/labor unit} per cycle."
      rationale: "Quantifies the productivity gain."
    - pattern: "Reaches {distance} ft — covers {job artifact} from one setup."
      rationale: "Reposition-time framing — fewer machine moves per shift."
    - pattern: "Year-round machine, not a fair-weather {type}."
      rationale: "Reframes enclosed cab + heat/AC into seasonal economics."
    - pattern: "Rotates flush against walls without contact."
      rationale: "Concrete physical-clearance benefit."
    - pattern: "Doesn't lose capacity when you need full reach."
      rationale: "Positions stabilizers/counterweight against competitor weakness."
    - pattern: "Production-class {attachments}."
      rationale: "Tier-separates light-duty from production work."

  # 3. Weakest generic spec phrases — block or downrank
  weakest_generic_phrases_to_avoid:
    - "great power"
    - "powerful engine"
    - "strong performance"
    - "heavy duty"
    - "well built"
    - "solid build"
    - "clean machine"
    - "well kept"
    - "good lifting capacity"
    - "good hydraulic flow"
    - "high flow capable"
    - "good fuel capacity"
    - "comfortable cab"
    - "climate controlled"
    - "smooth ride"
    - "safety features"
    - "compact size"
    - "good tracks"
    - "good undercarriage"
    - "fast"
    - "quick"
    - "good reach"
    - "deep digging"
    - "good lift"
    - "high lift"
    - "high capacity"
    - "good capacity"
    - "good dump height"
    - "wide blade"
    - "with attachments"

  # 4. Top 20 highest-converting op-value patterns
  top_20_op_value_patterns:

    - id: 1
      pattern: "High flow → mulchers / planers / cold planers / brush cutters at full rated speed"
      categories: [compact_track_loader, skid_steer_loader]
      example: "High-flow circuit — runs production mulchers and cold planers at full rated speed without bogging."

    - id: 2
