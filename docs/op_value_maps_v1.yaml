# =============================================================================
# MTM Listing Copy Engine v3 — Operational Value Translation Maps
# File: docs/op_value_maps_v1.yaml
# Purpose: Translate raw OEM specs and feature flags into contractor-facing
#          outcome language. Every spec must answer "so what does this do for
#          me on the job site?"
#
# Lookup contract:
#   spec field → operational_meaning → buyer_value → ideal_for use cases
#   weak phrasing list (avoid) → strong phrasing list (use)
#
# Confidence levels:
#   high   — phrase is dealer-validated, used by top dealers, low risk
#   medium — phrase is supportable, but should be backed by spec value
#   low    — context-dependent; use only when surrounding facts confirm it
#
# Versioning:
#   v1 — Initial build. CTL, SSL, mini-ex, telehandler, full excavator,
#        wheel loader, dozer.
# =============================================================================

meta:
  version: "v1.0"
  schema_version: 1
  generated_for: "MTM Listing Copy Engine v3"
  policy_notes:
    - "Op-value phrases reference specs already injected by spec_resolver. Never invent values."
    - "Phrases marked confidence: low require a corroborating numeric spec to use."
    - "Use case labels align with mtm_*_use_case_scorer.py outputs (CTL/SSL/MiniEx)."
    - "Listing copy may use a phrase only if the underlying field is non-null and not in requires_confirm."
    - "Generic spec-only phrases (left column) are blocked or downranked by the v3 copy engine."

# =============================================================================
# 1. COMPACT TRACK LOADERS (CTL)
# =============================================================================
compact_track_loader:

  # ---- General fields ----

  horsepower_hp:
    operational_meaning: "Sustained engine output drives hydraulic pump capacity and push force."
    buyer_value: "More HP = larger attachments run at full speed and the machine doesn't bog under load."
    ideal_for: [land_clearing, forestry_mulching, grading, snow_pushing]
    avoid_generic_phrase: ["powerful engine", "strong performance", "great power"]
    stronger_phrase:
      - "Net {horsepower_hp} HP — handles full-size mulchers and brush cutters without losing rpm under load."
      - "{horsepower_hp} HP keeps hydraulic flow up when grading, pushing, and running attachments at the same time."
    confidence: high

  operating_weight_lbs:
    operational_meaning: "Total machine weight determines stability for lift, push, and crowd."
    buyer_value: "Heavier machines push harder, lift more at reach, and stay planted on slopes."
    ideal_for: [grading, dirt_work, push_loading, slope_work]
    avoid_generic_phrase: ["heavy duty", "solid build", "well built"]
    stronger_phrase:
      - "{operating_weight_lbs} lb operating weight gives it the planted stance you need for full-bucket grading and pushing dirt without hop."
      - "At {operating_weight_lbs} lbs, this machine stays stable when lifting at full reach."
    confidence: high

  travel_speed_high_mph:
    operational_meaning: "Top travel speed in 2-speed high range. Drives site-to-site movement time."
    buyer_value: "Faster cross-site transit on larger jobs saves real cycle time."
    ideal_for: [snow_pushing, large_grade_jobs, site_prep, site_clearing]
    avoid_generic_phrase: ["fast", "quick"]
