  fuel_capacity_gal:
    operational_meaning: "Tank size determines runtime between fill-ups."
    buyer_value: "Larger tanks mean a full day of forestry/mulching/heavy load work without stopping mid-job."
    ideal_for: [forestry_mulching, land_clearing, snow_removal_routes]
    avoid_generic_phrase: ["good fuel capacity"]
