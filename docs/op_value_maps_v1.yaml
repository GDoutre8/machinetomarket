    confidence: high

  high_flow:
    operational_meaning: "High-flow auxiliary circuit option (typically 30+ GPM)."
    buyer_value: "Runs the heavy attachment-driven work — mulching, planing, cold planing, brush cutting — at full rated speed."
    ideal_for: [forestry_mulching, cold_planing, brush_cutting, asphalt_planing]
    avoid_generic_phrase: ["high flow hydraulics", "high flow ready"]
    stronger_phrase:
      - "Equipped with high-flow hydraulics — runs mulchers, planers, and stump grinders without bogging."
      - "High-flow circuit means production-grade attachments stay at full speed under load."
      - "High flow opens this machine up to the attachments that actually pay — mulching heads, cold planers, large brush cutters."
    confidence: high

  two_speed:
    operational_meaning: "Two-range travel transmission with high-speed mode."
    buyer_value: "Fast site-to-site repositioning on big lots — measurable cycle-time gain."
    ideal_for: [snow_pushing, large_site_grading, parking_lot_work]
    avoid_generic_phrase: ["two speed transmission"]
    stronger_phrase:
      - "Two-speed travel — flips into high range to cross big sites without crawling."
      - "2-speed gets you from one end of a parking lot to the other before the next push."
    confidence: high

  track_percent_remaining:
    operational_meaning: "Estimated rubber-track tread/lug life remaining."
    buyer_value: "Tracks at 70%+ are ready to work; below 50% means a track replacement is on the horizon ($1.5–4k+ pair)."
    ideal_for: [resale_decision, near_term_cost_planning]
    avoid_generic_phrase: ["good tracks"]
    stronger_phrase:
      - "Tracks at {track_percent_remaining}% — plenty of life before replacement."
      - "Tracks at {track_percent_remaining}% — factor that into your offer; replacement is around $2k–4k a pair."
