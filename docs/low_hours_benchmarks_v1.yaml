    high_hour_threshold_hours: 2000
  age_3_5_years:
    conservative_threshold_hours: 1800
    normal_threshold_hours: 3500
    high_hour_threshold_hours: 5000
  age_6_10_years:
    conservative_threshold_hours: 2800
    normal_threshold_hours: 5500
    high_hour_threshold_hours: 7500
  age_10_plus:
    conservative_threshold_hours: 3500
    normal_threshold_hours: 7000
